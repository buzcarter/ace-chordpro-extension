# Build the bundle and publish the demo site to GitHub Pages.
#
# - Pull requests: build only (shows whether the bundle still builds).
# - Push to main: build, then deploy index.html (uses dist/ace-chordpro.min.js),
#   editor.html and basic.html (use src/) to GitHub Pages.
#
# One-time setting: Settings -> Pages -> Source: "GitHub Actions".

name: Build & deploy demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble demo site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp index.html editor.html basic.html _site/
          cp -R dist src _site/

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
